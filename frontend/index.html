<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bird Adventure</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0a0f;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }
    </style>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script type="importmap">
      {
        "imports": {
          "phaser": "./node_modules/phaser/dist/phaser.esm.min.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="error-banner" style="display:none; position:fixed; top:16px; left:50%; transform:translateX(-50%); background:#8b1515; color:#fff; padding:14px 22px; border:2px solid #ffd700; border-radius:10px; font-family:sans-serif; font-size:14px; z-index:99999; box-shadow:0 6px 18px rgba(0,0,0,0.85); max-width:90%; text-align:center;">
      <div style="font-weight:bold; margin-bottom:4px;">⚠️ Game Notice</div>
      <div id="error-msg" style="color:#ffd9d9; font-size:12px; font-family:monospace;"></div>
    </div>
    <script>
      function reportGameError(msg) {
        var b = document.getElementById('error-banner');
        var m = document.getElementById('error-msg');
        if (b && m) {
          m.textContent = msg;
          b.style.display = 'block';
        }
      }
      window.addEventListener('error', function(e) {
        reportGameError((e.message || 'Error loading game module') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
      });
      window.addEventListener('unhandledrejection', function(e) {
        reportGameError('Unhandled error: ' + (e.reason ? (e.reason.message || e.reason) : 'Unknown'));
      });
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
